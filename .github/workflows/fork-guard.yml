name: fork-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fork-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fork patches are present
        run: sh tools/fork-guard.sh
